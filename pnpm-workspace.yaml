packages:
  - apps/*
  - packages/*

saveExact: true
autoInstallPeers: false

minimumReleaseAgeExclude:
  - "@typescript-eslint/eslint-plugin@8.71.1"
  - "@typescript-eslint/parser@8.71.1"
  - "@typescript-eslint/project-service@8.71.1"
  - "@typescript-eslint/scope-manager@8.71.1"
  - "@typescript-eslint/tsconfig-utils@8.71.1"
  - "@typescript-eslint/type-utils@8.71.1"
  - "@typescript-eslint/types@8.71.1"
  - "@typescript-eslint/typescript-estree@8.71.1"
  - "@typescript-eslint/utils@8.71.1"
  - "@typescript-eslint/visitor-keys@8.71.1"
  - typescript-eslint@8.71.1
  - "@playwright/test@1.64.0"
  - "@sentry/browser-utils@11.5.0"
  - "@sentry/browser@11.5.0"
  - "@sentry/bundler-plugins@11.5.0"
  - "@sentry/core@11.5.0"
  - "@sentry/feedback@11.5.0"
  - "@sentry/nextjs@11.5.0"
  - "@sentry/node@11.5.0"
  - "@sentry/opentelemetry@11.5.0"
  - "@sentry/react@11.5.0"
  - "@sentry/replay-canvas@11.5.0"
  - "@sentry/replay@11.5.0"
  - "@sentry/server-runtime-injection@11.5.0"
  - "@sentry/server-utils@11.5.0"
  - "@sentry/vercel-edge@11.5.0"
  - playwright-core@1.64.0
  - playwright@1.64.0

verifyDepsBeforeRun: error

allowBuilds:
  "@prisma/engines@7.10.0": true
  prisma@7.10.0: true
  sharp: true
  "@tailwindcss/oxide": true
  unrs-resolver@1.12.2: true
