name: Collaboration checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: collab
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: collab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collab -d collab"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8.10.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.13.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.9.1
      - run: pnpm install --frozen-lockfile
      - run: node scripts/create-ci-env.mjs
      - run: pnpm db:migrate:deploy
      - run: pnpm build
      - run: pnpm lint && pnpm typecheck && pnpm format:check
      - run: pnpm test:monitoring
      - run: pnpm test:phase6 && pnpm test:phase7 && pnpm test:phase3:storage
      - run: pnpm --filter @collab/web exec playwright install --with-deps chromium
      - run: pnpm test:phase8
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-failure-report
          path: .tools/playwright-report
          if-no-files-found: ignore
          retention-days: 7
